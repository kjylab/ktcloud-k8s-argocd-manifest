kube-prometheus-stack:
  grafana:
    adminPassword: admin1234

    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/grafana"
        serve_from_sub_path: true

    ingress:
      enabled: false

    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '\[([a-f0-9]{32})-[a-f0-9]{16}\]'
              url: '$${__value.raw}'
              datasourceUid: P214B5B846CF3925F
              urlDisplayLabel: View Trace in Tempo
      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        access: proxy
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: P8E80F9AEF21F6940
            spanStartTimeShift: '-1m'
            spanEndTimeShift: '1m'
            tags:
              - key: service.name
                value: app
            filterByTraceID: true
            filterBySpanID: false
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

    persistence:
      enabled: true
      storageClassName: ebs-sc
      size: 5Gi

  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Secret mount: /etc/alertmanager/secrets/alertmanager-slack-webhooks/<key>
      secrets:
        - alertmanager-slack-webhooks
    templateFiles:
      korean.tmpl: |-
        {{ define "slack.korean.severity" -}}
          {{- if eq .CommonLabels.severity "security" }}🚨 긴급
          {{- else if eq .CommonLabels.severity "critical" }}🔴 심각
          {{- else if eq .CommonLabels.severity "warning" }}⚠️ 경고
          {{- else }}ℹ️ 알림{{ end }}
        {{- end }}

        {{ define "slack.korean.status" -}}
          {{- if eq .Status "firing" }}🔥 발생
          {{- else }}✅ 해결{{ end }}
        {{- end }}

        {{ define "slack.korean.alertname" -}}
          {{- if eq .CommonLabels.alertname "KafkaConsumerLagHigh" }}Kafka 컨슈머 지연 과다
          {{- else if eq .CommonLabels.alertname "HighHttpErrorRate" }}HTTP 5xx 오류율 급등
          {{- else if eq .CommonLabels.alertname "JvmHeapPressure" }}JVM 힙 메모리 압박
          {{- else if eq .CommonLabels.alertname "CircuitBreakerOpened" }}서킷 브레이커 개방
          {{- else }}{{ .CommonLabels.alertname }}{{ end }}
        {{- end }}

        {{ define "slack.korean.title" -}}
          {{ template "slack.korean.status" . }} [{{ template "slack.korean.severity" . }}] {{ template "slack.korean.alertname" . }}
        {{- end }}

        {{ define "slack.korean.text" -}}
          {{ range .Alerts }}
          *요약:* {{ .Annotations.summary }}
          *내용:* {{ .Annotations.description }}
          {{ if .Labels.namespace }}*네임스페이스:* {{ .Labels.namespace }}{{ end }}
          {{ if .Labels.pod }}*파드:* {{ .Labels.pod }}{{ end }}
          {{ if .Labels.service }}*서비스:* {{ .Labels.service }}{{ end }}
          *발생 시각:* {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
          {{ if .EndsAt }}{{ if not .EndsAt.IsZero }}*해결 시각:* {{ .EndsAt.Format "2006-01-02 15:04:05 UTC" }}{{ end }}{{ end }}
          {{ end }}
        {{- end }}

        {{ define "slack.korean.security.title" -}}
          🚨 [긴급 보안] {{ template "slack.korean.alertname" . }}
        {{- end }}
    config:
      global:
        resolve_timeout: 5m
      templates:
        - /etc/alertmanager/config/*.tmpl
      route:
        receiver: default-slack
        group_by: ["alertname", "severity"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - matchers:
              - alertname =~ "Watchdog|InfoInhibitor|KubeCPUOvercommit"
            receiver: "null"
            continue: false
          - matchers:
              - severity = "security"
            receiver: security-slack
            continue: false
      receivers:
        - name: "null"
        - name: default-slack
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-default-url
              send_resolved: true
              title: '{{ template "slack.korean.title" . }}'
              text: '{{ template "slack.korean.text" . }}'
        - name: security-slack
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-security-url
              send_resolved: true
              title: '{{ template "slack.korean.security.title" . }}'
              text: '{{ template "slack.korean.text" . }}'

  kubeEtcd:
    enabled: false

  nodeExporter:
    enabled: true

  kubeStateMetrics:
    enabled: true
