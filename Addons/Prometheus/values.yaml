kube-prometheus-stack:
  grafana:
    adminPassword: admin1234

    grafana.ini:
      server:
        root_url: "%(protocol)s://%(domain)s/grafana"
        serve_from_sub_path: true

    ingress:
      enabled: true
      ingressClassName: traefik
      path: /grafana
      pathType: Prefix
      hosts:
        - ""

    additionalDataSources:
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '\[([a-f0-9]{32})-[a-f0-9]{16}\]'
              url: '$${__value.raw}'
              datasourceUid: P214B5B846CF3925F
              urlDisplayLabel: View Trace in Tempo
      - name: Tempo
        type: tempo
        url: http://tempo.monitoring.svc.cluster.local:3200
        access: proxy
        isDefault: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: P8E80F9AEF21F6940
            spanStartTimeShift: '-1m'
            spanEndTimeShift: '1m'
            tags:
              - key: service.name
                value: app
            filterByTraceID: true
            filterBySpanID: false
          serviceMap:
            datasourceUid: prometheus
          nodeGraph:
            enabled: true

    persistence:
      enabled: true
      storageClassName: ebs-sc
      size: 5Gi

  prometheus:
    prometheusSpec:
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: ebs-sc
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 20Gi

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 256Mi
      # Secret mount: /etc/alertmanager/secrets/alertmanager-slack-webhooks/<key>
      secrets:
        - alertmanager-slack-webhooks
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: default-slack
        group_by: ["alertname", "severity"]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - matchers:
              - severity = "security"
            receiver: security-slack
            continue: false
      receivers:
        - name: default-slack
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-default-url
              channel: "#alerts"
              send_resolved: true
              title: '{{ template "slack.default.title" . }}'
              text: '{{ template "slack.default.text" . }}'
        - name: security-slack
          slack_configs:
            - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhooks/slack-security-url
              channel: "#security-report"
              send_resolved: true
              title: ':rotating_light: {{ .CommonLabels.alertname }}'
              text: '{{ template "slack.default.text" . }}'

  nodeExporter:
    enabled: true

  kubeStateMetrics:
    enabled: true
