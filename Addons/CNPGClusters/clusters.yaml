apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: auth-db
  namespace: postgresql
spec:
  instances: 1
  bootstrap:
    initdb:
      database: auth_db
      owner: auth-service
      secret:
        name: auth-db-credentials
  storage:
    storageClass: ebs-sc
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
---
