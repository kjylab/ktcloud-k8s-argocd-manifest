global:
  defaultStorageClass: "ebs-sc"
  security:
    allowInsecureImages: true

kafka:
  kraft:
    enabled: true

  defaultInitContainers:
    volumePermissions:
      enabled: true
      containerSecurityContext:
        runAsUser: 0

  persistence:
    enabled: true
    storageClass: "ebs-sc"
    size: 2Gi

  listeners:
    client:
      containerPort: 9092
      protocol: PLAINTEXT
    controller:
      containerPort: 9093
      protocol: PLAINTEXT
    interbroker:
      containerPort: 9094
      protocol: PLAINTEXT

  extraEnvVars:
    - name: KAFKA_POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: KAFKA_CFG_ADVERTISED_LISTENERS
      value: "PLAINTEXT://$(KAFKA_POD_NAME).kafka-controller-headless.kafka.svc.cluster.local:9092"

  extraConfig: |
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT:PLAINTEXT
    inter.broker.listener.name=INTERNAL

metrics:
  kafka:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
      interval: 30s
